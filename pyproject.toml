[project]
name = "facto"
version = "0.1.0"
description = "Facto"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchaudio",
    "torchcodec",
    "numpy",
    "scikit-learn",
    "faiss-cpu",
    "tensorboard",
    "transformers",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facto"]
